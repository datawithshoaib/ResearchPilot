[project]
name = "researchpilot"
version = "0.2.0"
description = "Multi-agent research workflow served by a FastAPI backend."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "langchain>=1.4.2",
    "langchain-community>=0.4.2",
    "langchain-groq>=1.1.3",
    "langchain-tavily>=0.2.18",
    "langgraph>=1.2.12",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "uvicorn[standard]>=0.53.0",
]

[project.scripts]
researchpilot-api = "researchpilot.api.app:run"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "langgraph-cli[inmem]>=0.4.32",
    "pytest>=8.4.0",
    "ruff>=0.14.0",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/researchpilot/prompts.py" = ["E501"]
